id: template_chat_flow
name: Template Chat Flow
inputs:
  chat_history:
    type: list
    is_chat_input: false
    is_chat_history: true
  question:
    type: string
    is_chat_input: true
outputs:
  answer:
    type: string
    reference: ${redo.output}
    is_chat_output: true
nodes:
- name: translate
  type: llm
  source:
    type: code
    path: chat.jinja2
  inputs:
    deployment_name: gpt-4o-mini
    temperature: 0.8
    top_p: 1
    max_tokens: 256
    question: ${inputs.question}
  provider: AzureOpenAI
  connection: demo-ai-svc-res929348950322_aoai
  api: chat
  module: promptflow.tools.aoai
  use_variants: false
- name: comment
  type: llm
  source:
    type: code
    path: comment.jinja2
  inputs:
    deployment_name: gpt-4o
    temperature: 1
    top_p: 1
    response_format:
      type: text
    original: ${translate.output}
    question: ${inputs.question}
  provider: AzureOpenAI
  connection: demo-ai-svc-res929348950322_aoai
  api: chat
  module: promptflow.tools.aoai
  use_variants: false
- name: redo
  type: llm
  source:
    type: code
    path: redo.jinja2
  inputs:
    deployment_name: gpt-4o
    temperature: 1
    top_p: 1
    response_format:
      type: text
    original: ${inputs.question}
    question: ${comment.output}
    result: ${translate.output}
  provider: AzureOpenAI
  connection: demo-ai-svc-res929348950322_aoai
  api: chat
  module: promptflow.tools.aoai
  use_variants: false
node_variants: {}
environment:
  python_requirements_txt: requirements.txt
